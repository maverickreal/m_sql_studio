# Slice5: one gateway image, two replicas.
# ONLY api-gateway defines `build:` — api-gateway-b reuses the same tagged
# image with identical runtime config via this anchor. Build once, run twice:
#   docker compose build api-gateway && docker compose up -d
# Both containers then report the same Image SHA
# (docker inspect ... --format '{{.Image}}').
x-api-gateway-common: &api-gateway-common
  expose:
    - "8000"
  pull_policy: never
  environment:
    CLIENT_URL: "${CLIENT_URL}"
    ADMIN_SECRET_CODE: "${ADMIN_SECRET_CODE}"
    SERVER_PORT: "8000"
    MONGO_URI: "mongodb://${API_GATEWAY_MONGO_USER}:${API_GATEWAY_MONGO_PASSWORD}@mongo1:27017,mongo2:27017,mongo3:27017/${API_GATEWAY_MONGO_DB}?replicaSet=rs0&authSource=${API_GATEWAY_MONGO_DB}"
    REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
    ENV_MODE: "${ENV_MODE}"
    LOG_LEVEL: "${LOG_LEVEL}"
    LOG_DIR: "/var/log/m_sql_studio"
    BULLMQ_SQL_QUEUE_NAME: "${BULLMQ_SQL_QUEUE_NAME}"
    SANDBOX_PG_HOST: "postgres"
    SANDBOX_PG_PORT: "5432"
    SANDBOX_PG_DATABASE: "${POSTGRES_DB}"
    SANDBOX_PG_USER: "${SANDBOX_PG_USER}"
    SANDBOX_PG_PASSWORD: "${SANDBOX_PG_PASSWORD}"
    INTERNAL_API_KEY: "${INTERNAL_API_KEY}"
    BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET}"
    BETTER_AUTH_URL: "${BETTER_AUTH_URL}"
    GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
    GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
    GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID}"
    GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET}"
    DEFAULT_ADMIN_EMAIL: "${DEFAULT_ADMIN_EMAIL}"
    DEFAULT_ADMIN_PASSWORD: "${DEFAULT_ADMIN_PASSWORD}"
    HINT_ENABLED: "${HINT_ENABLED:-false}"
    HINT_API_URL: "${HINT_API_URL:-http://host.docker.internal:11434/v1}"
    HINT_MODEL: "${HINT_MODEL:-gemma3:4b}"
    HINT_ALLOW_REMOTE: "${HINT_ALLOW_REMOTE:-false}"
    HINT_SAY: "${HINT_SAY:-false}"
  healthcheck:
    test:
      [
        "CMD",
        "node",
        "-e",
        "fetch('http://127.0.0.1:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
      ]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 25s
  depends_on:
    redis:
      condition: service_healthy
    mongo1:
      condition: service_healthy
  restart: unless-stopped

services:
  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  mongo1:
    image: mongo:7
    command: >
      bash -c "
      mongod --replSet rs0 --bind_ip_all --keyFile /data/mongo-keyfile &
      sleep 5;
      bash /scripts/setup.sh;
      wait -n;
      "
    environment:
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      API_GATEWAY_MONGO_ROLE: ${API_GATEWAY_MONGO_ROLE}
      API_GATEWAY_MONGO_DB: ${API_GATEWAY_MONGO_DB}
      API_GATEWAY_MONGO_USER: ${API_GATEWAY_MONGO_USER}
      API_GATEWAY_MONGO_PASSWORD: ${API_GATEWAY_MONGO_PASSWORD}
    volumes:
      - mongo1-data:/data/db
      - ./misc/init-db/mongodb/mongo-keyfile:/data/mongo-keyfile:ro
      - ./misc/init-db/mongodb/setup.sh:/scripts/setup.sh:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s

  mongo2:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all", "--keyFile", "/data/mongo-keyfile"]
    volumes:
      - mongo2-data:/data/db
      - ./misc/init-db/mongodb/mongo-keyfile:/data/mongo-keyfile:ro

  mongo3:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all", "--keyFile", "/data/mongo-keyfile"]
    volumes:
      - mongo3-data:/data/db
      - ./misc/init-db/mongodb/mongo-keyfile:/data/mongo-keyfile:ro

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      SANDBOX_PG_USER: ${SANDBOX_PG_USER}
      SANDBOX_PG_PASSWORD: ${SANDBOX_PG_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./misc/init-db/postgresql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 3

  api-gateway:
    <<: *api-gateway-common
    extra_hosts:
      - "host.docker.internal:host-gateway"
    image: m_sql_studio-api-gateway:latest
    build:
      # Single build for both replicas — prevents replica skew.
      context: ./m_sql_studio_api_gateway
      dockerfile: Dockerfile
      args:
        - ENV_MODE=${ENV_MODE}
    develop:
      watch:
        - path: ./m_sql_studio_api_gateway/src
          action: rebuild
          target: /app/dist

  api-gateway-b:
    <<: *api-gateway-common
    # No `build:` here — reuses the image built once for api-gateway,
    # so both replicas always run the identical Image SHA.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    image: m_sql_studio-api-gateway:latest
    ports: []

  nginx-edge:
    image: nginx:1.27-alpine
    ports:
      - "8000:8000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-cache:/var/cache/nginx
    depends_on:
      api-gateway:
        condition: service_healthy
      api-gateway-b:
        condition: service_healthy
    restart: unless-stopped

  sandbox-executor:
    pull_policy: never
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: ./m_sql_studio_sandbox
      dockerfile: Dockerfile
      args:
        - ENV_MODE=${ENV_MODE}
    environment:
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
      PG_HOST: "postgres"
      PG_PORT: "5432"
      PG_DATABASE: "${POSTGRES_DB}"
      PG_USER: "${SANDBOX_PG_USER}"
      PG_PASSWORD: "${SANDBOX_PG_PASSWORD}"
      ADMIN_PG_USER: "${POSTGRES_USER}"
      ADMIN_PG_PASSWORD: "${POSTGRES_PASSWORD}"
      ENV_MODE: "${ENV_MODE}"
      LOG_LEVEL: "${LOG_LEVEL}"
      LOG_DIR: "/var/log/m_sql_studio"
      BULLMQ_SQL_QUEUE_NAME: "${BULLMQ_SQL_QUEUE_NAME}"
      INTERNAL_API_KEY: "${INTERNAL_API_KEY}"
      # TODO: would use https instead.
      API_GATEWAY_URL: "http://api-gateway:8000"
    develop:
      watch:
        - path: ./m_sql_studio_sandbox/src
          action: rebuild
          target: /app/dist
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  client:
    pull_policy: never
    build:
      context: ./m_sql_studio_client
      dockerfile: Dockerfile
      args:
        NGINX_SERVER_NAME: "${NGINX_SERVER_NAME}"
        VITE_API_BASE_URL: ""
    ports:
      - "3000:80"
    develop:
      watch:
        - path: ./m_sql_studio_client/src
          action: rebuild
          target: /app/dist
    depends_on:
      nginx-edge:
        condition: service_started
    restart: unless-stopped

volumes:
  mongo1-data:
  mongo2-data:
  mongo3-data:
  postgres-data:
  redis-data:
  nginx-cache: