worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    log_format main '$remote_addr $request_method $uri $status '
                    '$body_bytes_sent rt=$request_time upstream=$upstream_addr '
                    'cache=$upstream_cache_status';
    access_log /var/log/nginx/access.log main;

    limit_req_zone $binary_remote_addr zone=edge:10m rate=30r/s;
    limit_req_status 429;

    proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m
                     max_size=64m inactive=10m use_temp_path=off;

    # FOSS passive health checks: nginx-plus `health_check`/`match` directives
    # are NOT available in nginx:1.27-alpine (emerg: invalid parameter
    # "health_check"). max_fails + fail_timeout is the FOSS equivalent —
    # a replica is skipped for 10s after 3 consecutive failures.
    upstream api_backends {
        least_conn;
        server api-gateway:8000 max_fails=3 fail_timeout=10s;
        server api-gateway-b:8000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 8000;
        server_name _;

        limit_req zone=edge burst=60 nodelay;

        location /health {
            proxy_pass http://api_backends/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache off;
        }

        location /api/v1/assignments/client-sql-code-run/status/ {
            proxy_pass http://api_backends;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 60s;
            chunked_transfer_encoding off;
        }

        location /api/v1/assignments/client-sql-code-run/ {
            proxy_pass http://api_backends;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_cache off;
        }

        location /api/auth/ {
            proxy_pass http://api_backends;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_cache off;
        }

        # Public assignment catalog only — skip cache when a session cookie is present.
        location = /api/v1/assignments {
            proxy_pass http://api_backends;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache api_cache;
            proxy_cache_methods GET HEAD;
            proxy_cache_valid 200 15s;
            proxy_cache_bypass $http_cookie;
            proxy_no_cache $http_cookie;
            add_header X-Cache-Status $upstream_cache_status always;
        }

        location / {
            proxy_pass http://api_backends;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_cache off;
        }
    }
}
